<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprentice — Live Feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --border: #334155;
    --accent: #22d3ee;
    --accent-hover: #67e8f9;
    --text: #f8fafc;
    --muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
    --purple: #a855f7;
  }
  body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
  header h1 { color: var(--accent); font-size: 1.1rem; letter-spacing: 0.12em; font-weight: 700; text-transform: uppercase; }
  header .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: ping 2s infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: 1; } 75% { transform: scale(2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  main { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
  .status { font-size: 0.85rem; color: var(--muted); padding: 0.6rem 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; width: fit-content; }
  .lang-bar { display: flex; gap: 0.5rem; }
  .lang-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
  .lang-btn:hover { border-color: var(--accent); color: var(--text); }
  .lang-btn.active { background: var(--accent); color: #020617; border-color: var(--accent); font-weight: 600; }
  #feed { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; overflow-y: auto; font-size: 0.95rem; line-height: 1.6; }
  .msg { border-bottom: 1px solid #1e293b; padding: 0.75rem 0; animation: fadeIn 0.3s ease; }
  .msg:last-child { border-bottom: none; }
  .msg .time { font-size: 0.7rem; color: var(--muted); margin-right: 0.5rem; font-weight: 600; }
  .msg .lang-tag { font-size: 0.65rem; color: var(--accent); margin-left: 0.5rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
  .msg.empty { color: var(--muted); font-style: italic; text-align: center; margin-top: 3rem; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
  .panel h3 { color: var(--accent); font-size: 0.9rem; margin-bottom: 0.5rem; font-weight: 700; letter-spacing: 0.05em; }
  textarea#marginalia { width: 100%; height: 120px; background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; resize: vertical; outline: none; }
  textarea#marginalia:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15); }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

  .diagram { width: 100%; max-height: 45vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; background: #020617; margin-top: 0.75rem; }
  .diagram .mermaid { margin: 0; }
  .diagram-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }

  .avatar-row { display: flex; gap: 1rem; align-items: flex-start; margin-top: 0.75rem; }
  .avatar-card { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .avatar-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  #upload-face { display: none; }
  .avatar-frame { border: 2px solid var(--border); border-radius: 12px; background: #020617; padding: 0.5rem; }
  #avatar-canvas { border-radius: 8px; width: 170px; height: 200px; object-fit: cover; background: #020617; display: block; }
  .avatar-empty { width: 170px; height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed var(--border); border-radius: 12px; color: var(--muted); font-size: 0.75rem; }
  .speech-bubble { background: var(--purple); color: #fff; border-radius: 14px 14px 14px 4px; padding: 0.85rem 1.1rem; font-size: 0.9rem; line-height: 1.5; max-width: 300px; box-shadow: 0 4px 16px rgba(168, 85, 247, 0.4); position: relative; display: none; }
  .speech-bubble::after { content: ''; position: absolute; top: 16px; left: -10px; border-width: 10px 10px 10px 0; border-style: solid; border-color: transparent var(--purple) transparent transparent; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .speaking { animation: bounce 1.2s ease-in-out infinite; }
  .btn-upload, .btn-revision { background: var(--purple); color: #fff; border: none; border-radius: 8px; padding: 0.6rem 1.25rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-upload:hover, .btn-revision:hover { background: #c026d3; transform: translateY(-1px); }
  .btn-upload:disabled, .btn-revision:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-revision.speaking { background: var(--danger); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  .avatar-hint { font-size: 0.7rem; color: var(--muted); text-align: center; max-width: 200px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>APPRENTICE</h1>
</header>
<main>
  <div id="status" class="status">Connecting&hellip;</div>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="en">English</button>
    <button class="lang-btn" data-lang="mr">मराठी</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
  </div>
  <div id="feed"><div class="msg empty">Waiting for maestro&hellip;</div></div>
  <div class="panel">
    <h3>Marginalia (Private)</h3>
    <textarea id="marginalia" placeholder="Your private notes here. Never sent to the server."></textarea>
    <div class="hint">This textarea is local only — nothing you type here leaves your browser.</div>
  </div>

  <div class="avatar-row">
    <div class="avatar-card">
      <div class="avatar-controls">
        <label class="btn-upload" for="upload-face">Upload Face</label>
        <input type="file" id="upload-face" accept="image/*">
        <button class="btn-revision" id="btn-revision">Revision Mode</button>
      </div>
      <div class="avatar-frame">
        <canvas id="avatar-canvas" width="170" height="200"></canvas>
        <div id="avatar-empty" class="avatar-empty">No face<br>uploaded</div>
      </div>
      <div class="avatar-hint">Upload a photo, then tap Revision Mode.</div>
    </div>
    <div class="speech-bubble" id="speech-bubble">
      <span id="speech-text"></span>
    </div>
  </div>
</main>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'neutral', look: 'handDrawn' });

const ws = new WebSocket(`ws://${location.host}/ws`);
const status = document.getElementById('status');
const feed = document.getElementById('feed');
let messages = [];

const uploadFace = document.getElementById('upload-face');
const canvas = document.getElementById('avatar-canvas');
const ctx = canvas.getContext('2d');
const avatarEmpty = document.getElementById('avatar-empty');
const btnRevision = document.getElementById('btn-revision');
const speechBubble = document.getElementById('speech-bubble');
const speechText = document.getElementById('speech-text');

let avatarImage = null;

const saved = localStorage.getItem('avatar_face');
if (saved) {
  avatarImage = new Image();
  avatarImage.onload = () => {
    avatarEmpty.style.display = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scale = Math.min(canvas.width / avatarImage.width, canvas.height / avatarImage.height);
    const x = (canvas.width - avatarImage.width * scale) / 2;
    const y = (canvas.height - avatarImage.height * scale) / 2;
    ctx.drawImage(avatarImage, x, y, avatarImage.width * scale, avatarImage.height * scale);
  };
  avatarImage.src = saved;
}

uploadFace.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    avatarImage = new Image();
    avatarImage.onload = () => {
      localStorage.setItem('avatar_face', ev.target.result);
      avatarEmpty.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scale = Math.min(canvas.width / avatarImage.width, canvas.height / avatarImage.height);
      const x = (canvas.width - avatarImage.width * scale) / 2;
      const y = (canvas.height - avatarImage.height * scale) / 2;
      ctx.drawImage(avatarImage, x, y, avatarImage.width * scale, avatarImage.height * scale);
    };
    avatarImage.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

ws.onopen = () => {
  status.textContent = 'Connected — listening to maestro.';
  status.style.color = 'var(--success)';
};
ws.onclose = () => {
  status.textContent = 'Disconnected.';
  status.style.color = 'var(--danger)';
};
ws.onerror = () => {
  status.textContent = 'Connection error.';
  status.style.color = 'var(--danger)';
};
ws.onmessage = (event) => {
  try {
    const msg = JSON.parse(event.data);
    if (msg.type === 'mermaid') {
      messages.push(msg);
      renderMermaid(msg);
    } else if (msg.type === 'revision') {
      messages.push(msg);
      showRevision(msg.text);
    } else {
      messages.push(msg);
      renderFeed();
    }
  } catch (e) {
    console.error('WS parse error', e);
  }
};

function renderFeed() {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  feed.innerHTML = '';
  [...messages].reverse().forEach(m => {
    if (m.type === 'mermaid' || m.type === 'revision') return;
    const div = document.createElement('div');
    div.className = 'msg';
    const now = new Date(m.ts * 1000);
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const text = m.en;
    div.innerHTML = `<span class="time">[${time}]</span><span class="lang-tag">[EN]</span>${text.replace(/\n/g, '<br>')}`;
    feed.appendChild(div);
  });
  feed.scrollTop = feed.scrollHeight;
}

function renderMermaid(msg) {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  const container = document.createElement('div');
  container.className = 'msg';
  container.style.borderBottom = '1px solid #1e293b';
  container.style.padding = '0.75rem 0';
  const now = new Date(msg.ts * 1000);
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const title = document.createElement('div');
  title.className = 'diagram-title';
  title.textContent = `[${time}] Voice Diagram`;
  const diagramDiv = document.createElement('div');
  diagramDiv.className = 'diagram';
  diagramDiv.innerHTML = `<div class="mermaid">${msg.code}</div>`;
  container.appendChild(title);
  container.appendChild(diagramDiv);
  feed.prepend(container);
  try { mermaid.init(undefined, diagramDiv.querySelector('.mermaid')); } catch (e) { console.error('Mermaid render error', e); }
  feed.scrollTop = feed.scrollHeight;
}

function showRevision(text) {
  speechText.textContent = text;
  speechBubble.style.display = 'block';
  btnRevision.classList.add('speaking');
  btnRevision.textContent = 'Speaking…';
  setTimeout(() => {
    btnRevision.classList.remove('speaking');
    btnRevision.textContent = 'Revision Mode';
    speechBubble.style.display = 'none';
  }, 6000);
}

btnRevision.addEventListener('click', () => {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'revision_request' }));
  }
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderFeed();
  });
});
</script>
</body>
</html>
