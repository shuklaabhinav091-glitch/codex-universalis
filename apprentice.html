<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprentice — Live Feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0c10; color: #c5c6c7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2833; padding: 1rem 2rem; border-bottom: 1px solid #45a29e; }
  header h1 { color: #66fcf1; font-size: 1.25rem; letter-spacing: 0.1em; }
  main { flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; overflow: hidden; }
  .status { font-size: 0.875rem; color: #45a29e; margin-bottom: 0.5rem; }
  .lang-bar { display: flex; gap: 0.5rem; }
  .lang-btn { background: #1f2833; border: 1px solid #45a29e; color: #c5c6c7; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.9rem; cursor: pointer; }
  .lang-btn:hover { border-color: #66fcf1; color: #66fcf1; }
  .lang-btn.active { background: #45a29e; color: #0b0c10; border-color: #45a29e; font-weight: 600; }
  #feed { flex: 1; background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 1rem; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.95rem; line-height: 1.5; }
  .msg { border-bottom: 1px solid #212830; padding: 0.75rem 0; animation: fadeIn 0.3s ease; }
  .msg:last-child { border-bottom: none; }
  .msg .time { font-size: 0.7rem; color: #666; margin-right: 0.5rem; }
  .msg .lang-tag { font-size: 0.65rem; color: #45a29e; margin-left: 0.5rem; text-transform: uppercase; }
  .msg.empty { color: #666; font-style: italic; text-align: center; margin-top: 2rem; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .panel { background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 1rem; }
  .panel h3 { color: #66fcf1; font-size: 0.9rem; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
  textarea#marginalia { width: 100%; height: 120px; background: #0b0c10; border: 1px solid #45a29e; border-radius: 6px; padding: 0.75rem; color: #c5c6c7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; resize: vertical; outline: none; }
  textarea#marginalia:focus { border-color: #66fcf1; }
  .hint { font-size: 0.75rem; color: #666; margin-top: 0.25rem; }
  .diagram { width: 100%; max-height: 40vh; overflow: auto; border: 1px solid #45a29e; border-radius: 8px; padding: 0.5rem; background: #0b0c10; margin-top: 0.75rem; }
  .diagram .mermaid { margin: 0; }
  .diagram-title { font-size: 0.8rem; color: #66fcf1; margin-bottom: 0.4rem; font-weight: 600; letter-spacing: 0.05em; }

  /* ---------- Avatar Professor ---------- */
  .avatar-row { display: flex; gap: 1rem; align-items: flex-start; margin-top: 0.75rem; }
  .avatar-card { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .avatar-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  #upload-face { display: none; }
  .avatar-frame { border: 2px solid #45a29e; border-radius: 12px; background: #0b0c10; padding: 0.5rem; }
  #avatar-canvas { border-radius: 8px; width: 180px; height: 220px; object-fit: cover; background: #0b0c10; }
  .avatar-empty { width: 180px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #45a29e; border-radius: 12px; color: #666; font-size: 0.8rem; }
  .speech-bubble { background: #45a29e; color: #0b0c10; border-radius: 12px 12px 12px 4px; padding: 0.75rem 1rem; font-size: 0.9rem; line-height: 1.4; max-width: 280px; box-shadow: 0 4px 12px rgba(69,162,158,0.4); position: relative; display: none; }
  .speech-bubble::after { content: ''; position: absolute; top: 14px; left: -10px; border-width: 10px 10px 10px 0; border-style: solid; border-color: transparent #45a29e transparent transparent; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .speaking { animation: bounce 1.2s ease-in-out infinite; }
  .btn-upload, .btn-revision { background: #7c3aed; color: #ffffff; border: none; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; }
  .btn-upload:hover, .btn-revision:hover { background: #a855f7; }
  .btn-upload:disabled, .btn-revision:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-revision.speaking { background: #ef4444; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
  .avatar-hint { font-size: 0.7rem; color: #666; text-align: center; max-width: 200px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
<header><h1>APPRENTICE</h1></header>
<main>
  <div class="status" id="status">Connecting&hellip;</div>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="en">English</button>
    <button class="lang-btn" data-lang="mr">मराठी</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
  </div>
  <div id="feed"><div class="msg empty">Waiting for maestro&hellip;</div></div>
  <div class="panel">
    <h3>Marginalia (Private)</h3>
    <textarea id="marginalia" placeholder="Your private notes here. Never sent to the server."></textarea>
    <div class="hint">This textarea is local only — nothing you type here leaves your browser.</div>
  </div>

  <!-- Avatar Professor Section -->
  <div class="avatar-row">
    <div class="avatar-card">
      <div class="avatar-controls">
        <label class="btn-upload" for="upload-face">Upload Face</label>
        <input type="file" id="upload-face" accept="image/*">
        <button class="btn-revision" id="btn-revision">Revision Mode</button>
      </div>
      <div class="avatar-frame">
        <canvas id="avatar-canvas" width="180" height="220"></canvas>
        <div id="avatar-empty" class="avatar-empty">No face<br>uploaded</div>
      </div>
      <div class="avatar-hint">Upload a photo, then tap Revision Mode.</div>
    </div>
    <div class="speech-bubble" id="speech-bubble">
      <span id="speech-text"></span>
    </div>
  </div>
</main>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'neutral', look: 'handDrawn' });

const ws = new WebSocket(`ws://${location.host}/ws`);
const status = document.getElementById('status');
const feed = document.getElementById('feed');
let messages = [];
let currentLang = 'en';

// Avatar elements
const uploadFace = document.getElementById('upload-face');
const canvas = document.getElementById('avatar-canvas');
const ctx = canvas.getContext('2d');
const avatarEmpty = document.getElementById('avatar-empty');
const btnRevision = document.getElementById('btn-revision');
const speechBubble = document.getElementById('speech-bubble');
const speechText = document.getElementById('speech-text');

let avatarImage = null;
let isSpeaking = false;

// Load saved avatar from localStorage
const saved = localStorage.getItem('avatar_face');
if (saved) {
  avatarImage = new Image();
  avatarImage.onload = () => {
    avatarEmpty.style.display = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scale = Math.min(canvas.width / avatarImage.width, canvas.height / avatarImage.height);
    const x = (canvas.width - avatarImage.width * scale) / 2;
    const y = (canvas.height - avatarImage.height * scale) / 2;
    ctx.drawImage(avatarImage, x, y, avatarImage.width * scale, avatarImage.height * scale);
  };
  avatarImage.src = saved;
}

// Upload face handler
uploadFace.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    avatarImage = new Image();
    avatarImage.onload = () => {
      localStorage.setItem('avatar_face', ev.target.result);
      avatarEmpty.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scale = Math.min(canvas.width / avatarImage.width, canvas.height / avatarImage.height);
      const x = (canvas.width - avatarImage.width * scale) / 2;
      const y = (canvas.height - avatarImage.height * scale) / 2;
      ctx.drawImage(avatarImage, x, y, avatarImage.width * scale, avatarImage.height * scale);
    };
    avatarImage.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

ws.onopen = () => {
  status.textContent = 'Connected — listening to maestro.';
  status.style.color = '#45a29e';
};
ws.onclose = () => {
  status.textContent = 'Disconnected.';
  status.style.color = '#ff6b6b';
};
ws.onerror = () => {
  status.textContent = 'Connection error.';
  status.style.color = '#ff6b6b';
};
ws.onmessage = (event) => {
  try {
    const msg = JSON.parse(event.data);
    if (msg.type === 'mermaid') {
      messages.push(msg);
      renderMermaid(msg);
    } else if (msg.type === 'revision') {
      messages.push(msg);
      showRevision(msg.text);
    } else {
      messages.push(msg);
      renderFeed();
    }
  } catch (e) {
    console.error('WS parse error', e);
  }
};

function renderFeed() {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  feed.innerHTML = '';
  [...messages].reverse().forEach(m => {
    if (m.type === 'mermaid' || m.type === 'revision') return;
    const div = document.createElement('div');
    div.className = 'msg';
    const now = new Date(m.ts * 1000);
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const text = m.en;
    div.innerHTML = `<span class="time">[${time}]</span><span class="lang-tag">[EN]</span>${text.replace(/\n/g, '<br>')}`;
    feed.appendChild(div);
  });
  feed.scrollTop = feed.scrollHeight;
}

function renderMermaid(msg) {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  const container = document.createElement('div');
  container.className = 'msg';
  container.style.borderBottom = '1px solid #212830';
  container.style.padding = '0.75rem 0';
  const now = new Date(msg.ts * 1000);
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const title = document.createElement('div');
  title.className = 'diagram-title';
  title.textContent = `[${time}] Voice Diagram`;
  const diagramDiv = document.createElement('div');
  diagramDiv.className = 'diagram';
  diagramDiv.innerHTML = `<div class="mermaid">${msg.code}</div>`;
  container.appendChild(title);
  container.appendChild(diagramDiv);
  feed.prepend(container);

  // Render mermaid diagram
  try {
    mermaid.init(undefined, diagramDiv.querySelector('.mermaid'));
  } catch (e) {
    console.error('Mermaid render error', e);
  }
  feed.scrollTop = feed.scrollHeight;
}

function showRevision(text) {
  speechText.textContent = text;
  speechBubble.style.display = 'block';
  btnRevision.classList.add('speaking');
  btnRevision.textContent = 'Speaking&hellip;';
  setTimeout(() => {
    btnRevision.classList.remove('speaking');
    btnRevision.textContent = 'Revision Mode';
    speechBubble.style.display = 'none';
  }, 6000);
}

btnRevision.addEventListener('click', () => {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'revision_request' }));
  }
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLang = btn.dataset.lang;
    renderFeed();
  });
});
</script>
</body>
</html>
