<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprentice — Codex Universalis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --border: #334155;
    --accent: #22d3ee;
    --accent-glow: rgba(34, 211, 238, 0.4);
    --text: #f8fafc;
    --muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
    --purple: #a855f7;
    --purple-glow: rgba(168, 85, 247, 0.45);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @keyframes ping {
    0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 var(--accent-glow); }
    75% { transform: scale(2.5); opacity: 0; box-shadow: 0 0 0 12px transparent; }
    100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
    z-index: 10;
  }
  header h1 {
    color: var(--accent);
    font-size: 1rem;
    letter-spacing: 0.14em;
    font-weight: 700;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  header .dot {
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
    animation: ping 2.5s infinite;
  }
  main {
    flex: 1;
    padding: 2rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .status {
    font-size: 0.8rem;
    color: var(--muted);
    padding: 0.55rem 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: fit-content;
    backdrop-filter: blur(4px);
  }
  .status.online { color: var(--success); border-color: var(--success); box-shadow: 0 0 12px var(--accent-glow); }
  .status.offline { color: var(--danger); border-color: var(--danger); }
  .lang-bar { display: flex; gap: 0.5rem; }
  .lang-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 0.45rem 1rem;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.18s;
  }
  .lang-btn:hover { border-color: var(--accent); color: var(--text); }
  .lang-btn.active {
    background: var(--accent);
    color: #020617;
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  #feed {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    overflow-y: auto;
    font-size: 0.95rem;
    line-height: 1.6;
    backdrop-filter: blur(8px);
  }
  .msg {
    border-bottom: 1px solid #1e293b;
    padding: 0.75rem 0;
    animation: fadeIn 0.35s ease;
    animation-fill-mode: both;
  }
  .msg:last-child { border-bottom: none; }
  .msg .time {
    font-size: 0.7rem;
    color: var(--muted);
    margin-right: 0.5rem;
    font-weight: 700;
  }
  .msg .lang-tag {
    font-size: 0.65rem;
    color: var(--accent);
    margin-left: 0.5rem;
    text-transform: uppercase;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .msg.empty {
    color: var(--muted);
    font-style: italic;
    text-align: center;
    margin-top: 4rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    backdrop-filter: blur(8px);
  }
  .panel h3 {
    color: var(--accent);
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  textarea#marginalia {
    width: 100%;
    height: 120px;
    background: #020617;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.9rem;
    resize: vertical;
    outline: none;
  }
  textarea#marginalia:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.35rem;
  }

  /* Diagrams */
  .diagram-msg {
    border-bottom: 1px solid #1e293b;
    padding: 0.75rem 0;
    animation: fadeIn 0.4s ease;
    animation-fill-mode: both;
  }
  .diagram-msg:last-child { border-bottom: none; }
  .diagram-title {
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.45rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .diagram-wrap {
    width: 100%;
    max-height: 42vh;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
    background: #020617;
  }
  .diagram-wrap .mermaid { margin: 0; }

  /* Avatar Professor */
  .avatar-row {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    margin-top: 0.75rem;
  }
  .avatar-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }
  .avatar-controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  #upload-face { display: none; }
  .avatar-frame {
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #020617;
    padding: 0.5rem;
    width: 170px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  #avatar-canvas {
    border-radius: 8px;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #020617;
    display: block;
  }
  .avatar-empty {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 0.72rem;
    line-height: 1.4;
    text-align: center;
  }
  .speech-bubble {
    background: var(--purple);
    color: #fff;
    border-radius: 16px 16px 16px 4px;
    padding: 0.95rem 1.2rem;
    font-size: 0.9rem;
    line-height: 1.55;
    max-width: 320px;
    box-shadow: 0 4px 18px var(--purple-glow);
    position: relative;
    display: none;
    animation: slideUp 0.3s ease;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    top: 18px;
    left: -10px;
    border-width: 10px 10px 10px 0;
    border-style: solid;
    border-color: transparent var(--purple) transparent transparent;
  }
  .btn-upload, .btn-revision {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.65rem 1.25rem;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    box-shadow: 0 0 12px var(--purple-glow);
  }
  .btn-upload:hover, .btn-revision:hover {
    background: #c026d3;
    transform: translateY(-1px);
    box-shadow: 0 0 18px var(--purple-glow);
  }
  .btn-upload:disabled, .btn-revision:disabled {
    opacity: 0.45; cursor: not-allowed;
  }
  .btn-revision.speaking {
    background: var(--danger);
    animation: pulse 1.4s infinite;
  }
  .avatar-hint {
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    max-width: 200px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>APPRENTICE</h1>
</header>
<main>
  <div id="status" class="status offline">Disconnected</div>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="en">English</button>
    <button class="lang-btn" data-lang="mr">मराठी</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
  </div>
  <div id="feed"><div class="msg empty">Waiting for maestro&hellip;</div></div>
  <div class="panel">
    <h3>Marginalia (Private)</h3>
    <textarea id="marginalia" placeholder="Your private notes here&hellip;"></textarea>
    <div class="hint">Local only — never sent to the server.</div>
  </div>

  <div class="avatar-row">
    <div class="avatar-card">
      <div class="avatar-controls">
        <label class="btn-upload" for="upload-face">Upload Face</label>
        <input type="file" id="upload-face" accept="image/*">
        <button class="btn-revision" id="btn-revision">Revision Mode</button>
      </div>
      <div class="avatar-frame">
        <canvas id="avatar-canvas" width="170" height="200"></canvas>
        <div id="avatar-empty" class="avatar-empty">No face<br>uploaded</div>
      </div>
      <div class="avatar-hint">Upload a photo, then tap Revision Mode.</div>
    </div>
    <div class="speech-bubble" id="speech-bubble">
      <span id="speech-text"></span>
    </div>
  </div>
</main>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'neutral', look: 'handDrawn' });

const ws = new WebSocket(`ws://${location.host}/ws`);
const status = document.getElementById('status');
const feed = document.getElementById('feed');
let messages = [];

function setStatus(online, text) {
  status.textContent = text;
  status.className = 'status ' + (online ? 'online' : 'offline');
}

ws.onopen = () => { setStatus(true, 'Connected — listening to maestro.'); };
ws.onclose = () => { setStatus(false, 'Disconnected.'); setTimeout(() => window.location.reload(), 3000); };
ws.onerror = () => { setStatus(false, 'Connection error.'); };

ws.onmessage = (event) => {
  try {
    const msg = JSON.parse(event.data);
    if (msg.type === 'mermaid') {
      messages.push(msg);
      renderMermaid(msg);
    } else if (msg.type === 'revision') {
      messages.push(msg);
      showRevision(msg.text);
    } else {
      messages.push(msg);
      renderFeed();
    }
  } catch (e) { console.error('WS parse error', e); }
};

function renderFeed() {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  feed.innerHTML = '';
  [...messages].reverse().forEach(m => {
    if (m.type === 'mermaid' || m.type === 'revision') return;
    const div = document.createElement('div');
    div.className = 'msg';
    const now = new Date(m.ts * 1000);
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `<span class="time">[${time}]</span><span class="lang-tag">[EN]</span>${(m.en || '').replace(/\n/g, '<br>')}`;
    feed.appendChild(div);
  });
  feed.scrollTop = feed.scrollHeight;
}

function renderMermaid(msg) {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  const container = document.createElement('div');
  container.className = 'diagram-msg';
  const now = new Date(msg.ts * 1000);
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const title = document.createElement('div');
  title.className = 'diagram-title';
  title.textContent = `[${time}] Voice Diagram`;
  const diagramDiv = document.createElement('div');
  diagramDiv.className = 'diagram-wrap';
  diagramDiv.innerHTML = `<div class="mermaid">${msg.code}</div>`;
  container.appendChild(title);
  container.appendChild(diagramDiv);
  feed.prepend(container);
  try { mermaid.init(undefined, diagramDiv.querySelector('.mermaid')); } catch (e) { console.error('Mermaid render error', e); }
  feed.scrollTop = feed.scrollHeight;
}

function showRevision(text) {
  const speechBubble = document.getElementById('speech-bubble');
  const speechText = document.getElementById('speech-text');
  const btnRevision = document.getElementById('btn-revision');
  speechText.textContent = text;
  speechBubble.style.display = 'block';
  btnRevision.classList.add('speaking');
  btnRevision.textContent = 'Speaking…';
  setTimeout(() => {
    btnRevision.classList.remove('speaking');
    btnRevision.textContent = 'Revision Mode';
    speechBubble.style.display = 'none';
  }, 6000);
}

const uploadFace = document.getElementById('upload-face');
const canvas = document.getElementById('avatar-canvas');
const ctx = canvas.getContext('2d');
const avatarEmpty = document.getElementById('avatar-empty');
const btnRevision = document.getElementById('btn-revision');
let avatarImage = null;

const saved = localStorage.getItem('avatar_face');
if (saved) {
  avatarImage = new Image();
  avatarImage.onload = () => {
    avatarEmpty.style.display = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scale = Math.min(canvas.width / avatarImage.width, canvas.height / avatarImage.height);
    const x = (canvas.width - avatarImage.width * scale) / 2;
    const y = (canvas.height - avatarImage.height * scale) / 2;
    ctx.drawImage(avatarImage, x, y, avatarImage.width * scale, avatarImage.height * scale);
  };
  avatarImage.src = saved;
}

uploadFace.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    avatarImage = new Image();
    avatarImage.onload = () => {
      localStorage.setItem('avatar_face', ev.target.result);
      avatarEmpty.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scale = Math.min(canvas.width / avatarImage.width, canvas.height / avatarImage.height);
      const x = (canvas.width - avatarImage.width * scale) / 2;
      const y = (canvas.height - avatarImage.height * scale) / 2;
      ctx.drawImage(avatarImage, x, y, avatarImage.width * scale, avatarImage.height * scale);
    };
    avatarImage.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

btnRevision.addEventListener('click', () => {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'revision_request' }));
  }
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderFeed();
  });
});
</script>
</body>
</html>
