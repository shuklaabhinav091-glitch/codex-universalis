<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprentice — Live Feed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0c10; color: #c5c6c7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2833; padding: 1rem 2rem; border-bottom: 1px solid #45a29e; }
  header h1 { color: #66fcf1; font-size: 1.25rem; letter-spacing: 0.1em; }
  main { flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; overflow: hidden; }
  .status { font-size: 0.875rem; color: #45a29e; margin-bottom: 0.5rem; }
  .lang-bar { display: flex; gap: 0.5rem; }
  .lang-btn { background: #1f2833; border: 1px solid #45a29e; color: #c5c6c7; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.9rem; cursor: pointer; }
  .lang-btn:hover { border-color: #66fcf1; color: #66fcf1; }
  .lang-btn.active { background: #45a29e; color: #0b0c10; border-color: #45a29e; font-weight: 600; }
  #feed { flex: 1; background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 1rem; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.95rem; line-height: 1.5; }
  .msg { border-bottom: 1px solid #212830; padding: 0.75rem 0; animation: fadeIn 0.3s ease; }
  .msg:last-child { border-bottom: none; }
  .msg .time { font-size: 0.7rem; color: #666; margin-right: 0.5rem; }
  .msg .lang-tag { font-size: 0.65rem; color: #45a29e; margin-left: 0.5rem; text-transform: uppercase; }
  .msg.empty { color: #666; font-style: italic; text-align: center; margin-top: 2rem; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .panel { background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 1rem; }
  .panel h3 { color: #66fcf1; font-size: 0.9rem; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
  textarea#marginalia { width: 100%; height: 120px; background: #0b0c10; border: 1px solid #45a29e; border-radius: 6px; padding: 0.75rem; color: #c5c6c7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9rem; resize: vertical; outline: none; }
  textarea#marginalia:focus { border-color: #66fcf1; }
  .hint { font-size: 0.75rem; color: #666; margin-top: 0.25rem; }
</style>
</head>
<body>
<header><h1>APPRENTICE</h1></header>
<main>
  <div class="status" id="status">Connecting&hellip;</div>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="en">English</button>
    <button class="lang-btn" data-lang="mr">मराठी</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
  </div>
  <div id="feed"><div class="msg empty">Waiting for maestro&hellip;</div></div>
  <div class="panel">
    <h3>Marginalia (Private)</h3>
    <textarea id="marginalia" placeholder="Your private notes here. Never sent to the server."></textarea>
    <div class="hint">This textarea is local only — nothing you type here leaves your browser.</div>
  </div>
</main>
<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const status = document.getElementById('status');
const feed = document.getElementById('feed');
let messages = []; // stored messages: {en, mr, hi, ts}
let currentLang = 'en';

ws.onopen = () => {
  status.textContent = 'Connected — listening to maestro.';
  status.style.color = '#45a29e';
};
ws.onclose = () => {
  status.textContent = 'Disconnected.';
  status.style.color = '#ff6b6b';
};
ws.onerror = () => {
  status.textContent = 'Connection error.';
  status.style.color = '#ff6b6b';
};
ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  messages.push(msg);
  renderFeed();
};

function renderFeed() {
  const empty = feed.querySelector('.empty');
  if (empty) empty.remove();
  feed.innerHTML = '';
  [...messages].reverse().forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg';
    const now = new Date(m.ts * 1000);
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const text = m[currentLang] || m.en;
    div.innerHTML = `<span class="time">[${time}]</span><span class="lang-tag">[${currentLang}]</span>${text.replace(/\n/g, '<br>')}`;
    feed.appendChild(div);
  });
  feed.scrollTop = feed.scrollHeight;
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLang = btn.dataset.lang;
    renderFeed();
  });
});
</script>
</body>
</html>
