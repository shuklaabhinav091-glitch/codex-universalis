<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestro — Broadcast</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0c10; color: #c5c6c7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2833; padding: 1rem 2rem; border-bottom: 1px solid #45a29e; }
  header h1 { color: #66fcf1; font-size: 1.25rem; letter-spacing: 0.1em; }
  main { flex: 1; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; overflow: hidden; }
  .status { font-size: 0.875rem; color: #45a29e; margin-bottom: 0.5rem; }
  textarea { flex: 1; background: #1f2833; border: 1px solid #45a29e; border-radius: 8px; padding: 1rem; color: #c5c6c7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1rem; resize: none; outline: none; }
  textarea:focus { border-color: #66fcf1; }
  button { background: #45a29e; color: #0b0c10; border: none; border-radius: 8px; padding: 1rem 2rem; font-size: 1rem; font-weight: 600; cursor: pointer; width: fit-content; align-self: flex-start; }
  button:hover { background: #66fcf1; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 0.75rem; color: #666; margin-top: 0.25rem; }
</style>
</head>
<body>
<header><h1>MAESTRO</h1></header>
<main>
  <div class="status" id="status">Connecting&hellip;</div>
  <textarea id="note" placeholder="Type your lesson notes here&hellip;"></textarea>
  <button id="broadcast" disabled>Broadcast</button>
  <div class="hint">Broadcasts to all connected apprentices instantly.</div>
</main>
<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const status = document.getElementById('status');
const textarea = document.getElementById('note');
const btn = document.getElementById('broadcast');

ws.onopen = () => {
  status.textContent = 'Connected — ready to broadcast.';
  status.style.color = '#45a29e';
  btn.disabled = false;
};
ws.onclose = () => {
  status.textContent = 'Disconnected.';
  status.style.color = '#ff6b6b';
  btn.disabled = true;
};
ws.onerror = () => {
  status.textContent = 'Connection error.';
  status.style.color = '#ff6b6b';
  btn.disabled = true;
};

btn.onclick = () => {
  const text = textarea.value.trim();
  if (!text) return;
  ws.send(text);
  btn.textContent = 'Broadcasting&hellip;';
  setTimeout(() => { btn.textContent = 'Broadcast'; }, 800);
};
</script>
</body>
</html>
