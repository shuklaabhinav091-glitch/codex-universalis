<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestro — Teacher Broadcast</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --border: #334155;
    --accent: #22d3ee;
    --accent-hover: #67e8f9;
    --text: #f8fafc;
    --muted: #94a3b8;
    --danger: #ef4444;
    --success: #22c55e;
    --purple: #a855f7;
  }
  body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
  header h1 { color: var(--accent); font-size: 1.1rem; letter-spacing: 0.12em; font-weight: 700; text-transform: uppercase; }
  header .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: ping 2s infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: 1; } 75% { transform: scale(2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  main { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.25rem; }
  .status { font-size: 0.85rem; color: var(--muted); padding: 0.6rem 1rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; width: fit-content; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .textarea-wrap { background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.75rem; }
  textarea { flex: 1; background: transparent; border: none; border-radius: 6px; padding: 0; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1rem; resize: vertical; outline: none; line-height: 1.6; min-height: 200px; }
  textarea::placeholder { color: var(--muted); }
  .btn-group { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  button { border: none; border-radius: 8px; padding: 0.75rem 1.5rem; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #020617; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-dictate { background: var(--purple); color: #fff; }
  .btn-dictate:hover:not(:disabled) { background: #c026d3; transform: translateY(-1px); }
  .btn-dictate.listening { background: var(--danger); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
  .badge { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>MAESTRO</h1>
</header>
<main>
  <div id="status" class="status">Connecting&hellip;</div>

  <div class="card">
    <div class="badge">Lesson Notes</div>
    <div class="textarea-wrap">
      <textarea id="note" rows="6" placeholder="Type your lesson notes here&hellip;"></textarea>
    </div>
  </div>

  <div class="btn-group">
    <button id="broadcast" class="btn-primary" disabled>Broadcast</button>
    <button id="dictate" class="btn-dictate" disabled>Dictate</button>
  </div>
  <div class="hint">Broadcast sends text to all apprentices. Dictate captures speech and generates a diagram.</div>
</main>
<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const status = document.getElementById('status');
const textarea = document.getElementById('note');
const btn = document.getElementById('broadcast');
const dictateBtn = document.getElementById('dictate');

let recognition = null;

ws.onopen = () => {
  status.textContent = 'Connected — ready to broadcast.';
  status.style.color = 'var(--success)';
  btn.disabled = false;
  const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      dictateBtn.classList.remove('listening');
      dictateBtn.textContent = 'Dictate';
      if (text.trim()) {
        textarea.value = text;
        ws.send(JSON.stringify({ type: 'voice', text }));
        dictateBtn.textContent = 'Dictated…';
        setTimeout(() => { dictateBtn.textContent = 'Dictate'; }, 1000);
      }
    };
    recognition.onerror = () => {
      dictateBtn.classList.remove('listening');
      dictateBtn.textContent = 'Dictate';
      fallbackDictation();
    };
    recognition.onend = () => {
      dictateBtn.classList.remove('listening');
      dictateBtn.textContent = 'Dictate';
    };
    dictateBtn.disabled = false;
  } else {
    dictateBtn.disabled = false;
  }
};
ws.onclose = () => {
  status.textContent = 'Disconnected.';
  status.style.color = 'var(--danger)';
  btn.disabled = true;
  dictateBtn.disabled = true;
};
ws.onerror = () => {
  status.textContent = 'Connection error.';
  status.style.color = 'var(--danger)';
  btn.disabled = true;
  dictateBtn.disabled = true;
};

btn.onclick = () => {
  const text = textarea.value.trim();
  if (!text) return;
  ws.send(text);
  btn.textContent = 'Broadcasting…';
  setTimeout(() => { btn.textContent = 'Broadcast'; }, 800);
};

dictateBtn.onclick = () => {
  if (!recognition) { fallbackDictation(); return; }
  if (dictateBtn.classList.contains('listening')) {
    recognition.stop();
    return;
  }
  try {
    recognition.start();
    dictateBtn.classList.add('listening');
    dictateBtn.textContent = 'Listening…';
  } catch (e) {
    fallbackDictation();
  }
};

function fallbackDictation() {
  const text = prompt('Dictation mode — type what you would say:');
  if (text && text.trim()) {
    textarea.value = text;
    ws.send(JSON.stringify({ type: 'voice', text: text.trim() }));
    dictateBtn.textContent = 'Typed…';
    setTimeout(() => { dictateBtn.textContent = 'Dictate'; }, 1000);
  }
}
</script>
</body>
</html>
